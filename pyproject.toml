[project]
name = "church-translator"
version = "0.1.0"
description = "Live speech translation for church services: mixer in, sound card out, one channel per language."
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # Menu-bar app only. The booth Pi runs Linux and is driven by the Telegram
    # bot instead; rumps pulls in pyobjc, which does not build there.
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
providers = [
    "assemblyai>=0.35",
    "anthropic>=0.40",
    "cartesia>=1.0",
    # cli.py/menubar_app.py read the API keys out of .env through this. It used
    # to arrive only as a transitive dep of assemblyai -> pydantic-settings,
    # and that link is conditional on python_version >= "3.14" — on 3.11-3.13
    # the import silently fell through to the `except ImportError: pass`
    # branch and real mode died on KeyError: 'ASSEMBLYAI_API_KEY'. Direct now.
    "python-dotenv>=1.0",
]

[project.scripts]
church-translator = "church_translator.cli:main"
church-translator-app = "church_translator.menubar_app:run"
church-translator-bot = "church_translator.telegram_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/church_translator"]
