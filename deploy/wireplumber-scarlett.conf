# Keep PipeWire's hands off the Focusrite Scarlett on the booth Pi.
#
# Raspberry Pi OS with a desktop runs PipeWire, which claims every sound card
# it sees. church-translator opens the Scarlett directly through ALSA (one
# input channel in, one output channel per language), and a card PipeWire
# holds fails to open as "Device unavailable". Disabling just this card leaves
# PipeWire running for everything else (HDMI, the headphone jack).
#
# Installed by deploy/deploy.sh as
#   ~/.config/wireplumber/wireplumber.conf.d/51-church-translator-scarlett.conf
# (WirePlumber 0.5 syntax — Trixie ships 0.5.8).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Scarlett.*" }
      { device.name = "~alsa_card.*Focusrite.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
